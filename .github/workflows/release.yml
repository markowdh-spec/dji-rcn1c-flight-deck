name: Flight Zone APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare local debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RCN1C Soft Controls,O=Marko Test,C=DE"

      - name: Build Flight Bridge APK
        shell: bash
        run: |
          cd wireless/android-app
          gradle --no-daemon clean assembleRelease
          cp build/outputs/apk/release/*.apk ../RCN1C_Bridge.apk
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs ../RCN1C_Bridge.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: RCN1C-Flight-Zone-V0
          path: wireless/RCN1C_Bridge.apk
