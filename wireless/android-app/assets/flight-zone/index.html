<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RC-N1C Flight Zone</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#07111d;color:#fff;overflow:hidden}
#app{height:100vh;background:radial-gradient(circle at 70% 20%,#315e7a 0,#142b40 34%,#07111d 75%);display:grid;place-items:center}
.card{width:min(88vw,520px);padding:28px;border:1px solid #ffffff22;border-radius:28px;background:#07111dcc;backdrop-filter:blur(12px);box-shadow:0 24px 70px #0008}
.logo{font-size:13px;letter-spacing:.32em;color:#91b7d4}.title{font-size:38px;font-weight:800;line-height:1;margin:10px 0 8px}.sub{color:#9fb0bf;margin-bottom:26px}
.status{display:flex;align-items:center;gap:10px;padding:13px 15px;background:#ffffff0d;border-radius:14px;margin-bottom:18px}.dot{width:10px;height:10px;border-radius:50%;background:#34d77b;box-shadow:0 0 14px #34d77b}
button{width:100%;border:0;border-radius:16px;padding:17px;font-size:18px;font-weight:750;background:#2f8cff;color:#fff}small{display:block;text-align:center;color:#71879a;margin-top:18px}
</style></head>
<body><main id="app"><section class="card"><div class="logo">RC-N1C</div><div class="title">FLIGHT ZONE</div><div class="sub">Minimal flight challenge</div><div class="status"><span class="dot"></span><span>Controller bereit</span></div><button id="fly">FLIEGEN</button><small>Prototype V0 · Flight Zone · playable build</small></section></main>
<script>document.getElementById('fly').onclick=()=>{document.querySelector('.sub').textContent='3-Tore-Test kommt als nächster Schritt';};</script></body></html>
