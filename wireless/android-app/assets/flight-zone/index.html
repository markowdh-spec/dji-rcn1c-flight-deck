<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RC-N1C Flight Zone</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#07111d;color:#fff;overflow:hidden}
#app{height:100vh;background:radial-gradient(circle at 70% 20%,#315e7a 0,#142b40 34%,#07111d 75%);display:grid;place-items:center}
.card{width:min(88vw,520px);padding:28px;border:1px solid #ffffff22;border-radius:28px;background:#07111dcc;backdrop-filter:blur(12px);box-shadow:0 24px 70px #0008}
.logo{font-size:13px;letter-spacing:.32em;color:#91b7d4}.title{font-size:38px;font-weight:800;line-height:1;margin:10px 0 8px}.sub{color:#9fb0bf;margin-bottom:26px}
.status{display:flex;align-items:center;gap:10px;padding:13px 15px;background:#ffffff0d;border-radius:14px;margin-bottom:18px}.dot{width:10px;height:10px;border-radius:50%;background:#34d77b;box-shadow:0 0 14px #34d77b}
button{width:100%;border:0;border-radius:16px;padding:17px;font-size:18px;font-weight:750;background:#2f8cff;color:#fff}small{display:block;text-align:center;color:#71879a;margin-top:18px}
</style><script src="../fpv-sim/three.min.js"></script></head>
<body><div id="game" style="position:fixed;inset:0"></div><main id="app" style="position:fixed;inset:0;z-index:2"><section class="card"><div class="logo">RC-N1C</div><div id="money" style="float:right;font-size:22px;font-weight:800;color:#ffd54a">€ 0</div><div class="title">FLIGHT ZONE</div><div class="sub">Minimal flight challenge</div><div class="status"><span class="dot"></span><span>Controller bereit</span></div><button id="fly">FLIEGEN</button><small>Prototype V0 · Flight Zone · playable build</small></section></main>
<script>
const state={roll:0,pitch:0,yaw:0,throttle:0};let neutral={lx:0,ly:0,rx:0,ry:0,n:0,ready:false};let score=0,money=0;
window.setRcn1cStatus=(m,c)=>{document.querySelector('.status span:last-child').textContent=c?'RC-N1C verbunden':m};
window.setRcn1cFrame=(lx,ly,rx,ry,b,m,p,c)=>{if(!neutral.ready){neutral.lx+=lx;neutral.ly+=ly;neutral.rx+=rx;neutral.ry+=ry;neutral.n++;if(neutral.n>=30){neutral.lx/=neutral.n;neutral.ly/=neutral.n;neutral.rx/=neutral.n;neutral.ry/=neutral.n;neutral.ready=true}return}const dz=v=>Math.abs(v)<0.07?0:Math.sign(v)*(Math.abs(v)-0.07)/0.93;const cv=v=>{v=dz(Math.max(-1,Math.min(1,v)));return Math.sign(v)*Math.pow(Math.abs(v),1.8)};state.yaw=cv((lx-neutral.lx)/32767);state.throttle=dz((neutral.ly-ly)/32767);state.roll=cv((rx-neutral.rx)/32767);state.pitch=cv((neutral.ry-ry)/32767)};
let running=false,scene,camera,renderer,gates=[],gate=0,last=performance.now(),start=0;
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x86c9ee);scene.fog=new THREE.Fog(0x86c9ee,55,220);camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,400);camera.position.set(0,5,8);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);document.getElementById('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x557044,1.8));const g=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshLambertMaterial({color:0x609a52}));g.rotation.x=-Math.PI/2;scene.add(g);for(let i=0;i<40;i++){const x=((i*31)%91)-45,z=-10-((i*47)%170);const h=new THREE.Mesh(new THREE.ConeGeometry(3+(i%4),8+(i%5)*2,7),new THREE.MeshLambertMaterial({color:i%2?0x477c45:0x557f49}));h.position.set(x,h.geometry.parameters.height/2-1,z);scene.add(h)}[[0,7,-24,0x55d8ff,10],[11,9,-53,0xffd84a,25],[-9,6,-82,0xff5a72,50]].forEach((p,i)=>{const q=new THREE.Mesh(new THREE.TorusGeometry(4,.35,10,32),new THREE.MeshBasicMaterial({color:p[3]}));q.position.set(p[0],p[1],p[2]);q.userData={reward:p[4],baseColor:p[3]};scene.add(q);gates.push(q)});requestAnimationFrame(loop)}
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.04);last=t;if(running){camera.rotation.order='YXZ';camera.rotation.y-=state.yaw*.65*dt;camera.rotation.x=THREE.MathUtils.clamp(camera.rotation.x-state.pitch*.55*dt,-.65,.65);camera.rotation.z=THREE.MathUtils.lerp(camera.rotation.z,-state.roll*.32,.08);const f=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);f.y*=.3;camera.position.addScaledVector(f,5.2*dt);const r=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);camera.position.addScaledVector(r,state.roll*4*dt);camera.position.y=Math.max(1.3,camera.position.y+state.throttle*4*dt);if(gate<gates.length&&camera.position.distanceTo(gates[gate].position)<5.2){money+=gates[gate].userData.reward;document.getElementById('money').textContent='€ '+money;gates[gate].material.color.setHex(0x43e58a);gate++;score++;if(gate<gates.length){}else{running=false;document.querySelector('.title').textContent='ZIEL!';document.querySelector('.sub').textContent='Tore: '+score+' · Guthaben: € '+money+' · '+((t-start)/1000).toFixed(1)+' Sekunden';document.getElementById('app').style.display='grid'}}}renderer.render(scene,camera)}
document.getElementById('fly').onclick=()=>{if(!renderer)init();gate=0;score=0;neutral={lx:0,ly:0,rx:0,ry:0,n:0,ready:false};gates.forEach(x=>x.material.color.setHex(x.userData.baseColor));document.getElementById('money').textContent='€ '+money;camera.position.set(0,5,8);camera.rotation.set(0,0,0);start=performance.now();running=true;document.getElementById('app').style.display='none'};
addEventListener('resize',()=>{if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
